# Copy this document into oct-storefront catalog/community.yaml
# ONLY list spec.versions[] after quay.io/<org>/oct-windows-builder:<semver>-ocp<major.minor>
# and the matching builder image exist and are public for THAT minor.
# Always publish both -ocp4.21 and -ocp4.22. Never list a (version, OpenShift minor)
# row unless that exact tag is public.
apiVersion: communitytools.io/v1alpha1
kind: CommunityTool
metadata:
  name: oct-windows-builder
spec:
  displayName: Windows Builder
  description: >-
    Build sysprepped Windows disks for OpenShift Virtualization. Creates CDI
    DataVolumes from an ISO you provide (names match template DATA_SOURCE_NAME).
    No Tekton. Community project, not officially supported by Red Hat.
  category: compute
  source: community
  git: https://github.com/OOsemka/oct-windows-builder
  consolePlugin: oct-windows-builder
  href: /community-tools/compute/windows-builder
  # Bundled storefront SVG (src/assets/tiles/). Not a URL. Original paperclip assistant, not Microsoft Clippy art.
  icon: tiles/oct-windows-builder.svg
  defaultChannel: stable
  channels:
    stable: {}
    candidate: {}
  validatedOn:
    - "4.21"
    - "4.22"
  minOpenShift: "4.21"
  versions:
    - version: "1.0.0"
      channel: stable
      openshift: ["4.21"]
      image: quay.io/cjanisze/oct-windows-builder:1.0.0-ocp4.21
      gitRef: v1.0.0
    - version: "1.0.0"
      channel: stable
      openshift: ["4.22"]
      image: quay.io/cjanisze/oct-windows-builder:1.0.0-ocp4.22
      gitRef: v1.0.0
    - version: "1.0.1"
      channel: stable
      openshift: ["4.21"]
      image: quay.io/cjanisze/oct-windows-builder:1.0.1-ocp4.21
      gitRef: v1.0.1
    - version: "1.0.1"
      channel: stable
