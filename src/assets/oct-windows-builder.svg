<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Original geometric paperclip assistant for the Windows Builder tile.
       Not Microsoft Clippy trademark art, official bitmaps, or downloaded assets. -->
  <circle cx="32" cy="32" r="30" fill="#FFF8E8" stroke="#E2C97A" stroke-width="1.75"/>
  <!-- Paperclip wire (double loop) -->
  <path
    d="M28 18
       C22 18 18 23 18 29
       C18 38 26 48 32 52
       C38 48 46 38 46 29
       C46 23 42 18 36 18
       C31 18 28 22 28 27
       L28 38
       C28 41.5 30.5 44 34 44
       C37.5 44 40 41.5 40 38
       L40 26"
    stroke="#8A93A0"
    stroke-width="3.4"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <path
    d="M31 21
       C26.5 21 24 24.5 24 29
       C24 36.5 30 45 32 47.5
       C34 45 40 36.5 40 29
       C40 24.5 37.5 21 33 21"
    stroke="#C9D0D8"
    stroke-width="1.5"
    stroke-linecap="round"
    fill="none"
    opacity="0.9"
  />
  <!-- Eyes -->
  <ellipse cx="26.5" cy="28.5" rx="4.2" ry="4.6" fill="#FFFEFB" stroke="#4A5560" stroke-width="1"/>
  <ellipse cx="37.5" cy="28.5" rx="4.2" ry="4.6" fill="#FFFEFB" stroke="#4A5560" stroke-width="1"/>
  <circle cx="27.2" cy="29.2" r="1.7" fill="#243040"/>
  <circle cx="38.2" cy="29.2" r="1.7" fill="#243040"/>
  <circle cx="26.4" cy="28.3" r="0.55" fill="#FFFFFF"/>
  <circle cx="37.4" cy="28.3" r="0.55" fill="#FFFFFF"/>
  <!-- Eyebrows (angled, cartoon  original geometry) -->
  <path d="M21.5 22.8 Q26.5 20.2 30.2 23.4" stroke="#3A4450" stroke-width="2.05" fill="none" stroke-linecap="round"/>
  <path d="M33.8 23.4 Q37.5 20.2 42.5 22.8" stroke="#3A4450" stroke-width="2.05" fill="none" stroke-linecap="round"/>
  <!-- Small smile -->
  <path d="M28.2 35.6 Q32 38.2 35.8 35.6" stroke="#3A4450" stroke-width="1.35" fill="none" stroke-linecap="round"/>
</svg>
