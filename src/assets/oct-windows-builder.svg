<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Original paperclip assistant for the Windows Builder tile.
       Idea: a gem paperclip with googly eyes and eyebrows (Office-assistant vibe).
       Not Microsoft Clippy trademark art, official bitmaps, traces, or downloads. -->
  <defs>
    <linearGradient id="oct-wb-clip-metal" x1="16" y1="8" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E7ECF1"/>
      <stop offset="0.45" stop-color="#B7C0C8"/>
      <stop offset="1" stop-color="#8E98A2"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#FFF8E4" stroke="#E2C97A" stroke-width="1.75"/>
  <g transform="rotate(-10 32 33)">
    <!-- Gem-clip body: outer left → bottom → outer right → top loop → inner left → inner bottom → inner tongue -->
    <path
      d="M17.5 20.5
         L17.5 43
         C17.5 53.5 46.5 53.5 46.5 43
         L46.5 21
         C46.5 7.5 24.5 7.5 24.5 21
         L24.5 40.5
         C24.5 47.2 39.2 47.2 39.2 40.5
         L39.2 22"
      stroke="url(#oct-wb-clip-metal)"
      stroke-width="3.85"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <path
      d="M20.6 22
         L20.6 42.2
         C20.6 49.8 43.4 49.8 43.4 42.2
         L43.4 22.2"
      stroke="#F4F7FA"
      stroke-width="1.15"
      stroke-linecap="round"
      fill="none"
      opacity="0.85"
    />
    <!-- Googly eyes in the top loop -->
    <ellipse cx="29.6" cy="16.6" rx="5.35" ry="5.7" fill="#FFFEFB" stroke="#3A4450" stroke-width="1.05"/>
    <ellipse cx="41.1" cy="16.4" rx="5.55" ry="5.9" fill="#FFFEFB" stroke="#3A4450" stroke-width="1.05"/>
    <circle cx="31.15" cy="17.35" r="2.15" fill="#1B2430"/>
    <circle cx="42.7" cy="17.15" r="2.25" fill="#1B2430"/>
    <circle cx="30.35" cy="16.15" r="0.7" fill="#FFFFFF"/>
    <circle cx="41.85" cy="15.95" r="0.75" fill="#FFFFFF"/>
    <!-- Eyebrows -->
    <path d="M24.4 10.6 Q29.6 8.15 34.2 11.2" stroke="#2C3540" stroke-width="2.15" fill="none" stroke-linecap="round"/>
    <path d="M37.4 10.5 Q42.2 7.7 47.3 11.05" stroke="#2C3540" stroke-width="2.15" fill="none" stroke-linecap="round"/>
  </g>
</svg>
